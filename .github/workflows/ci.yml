name: CI

# Chạy khi push lên mọi nhánh (repo hiện chỉ có nhánh phát triển), khi mở PR, hoặc bấm tay.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:scripts
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder
          VITE_GOOGLE_HD: example.com

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  functions:
    name: Edge Functions (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check */index.ts
        working-directory: supabase/functions
      - run: deno test _shared/
        working-directory: supabase/functions

  database:
    name: Migrations + RLS tests (Supabase)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start Supabase (Postgres + Auth thật)
        # Registry image đôi khi giới hạn lượt tải (toomanyrequests) → thử lại tối đa 3 lần
        run: |
          n=0
          until supabase db start; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then exit 1; fi
            echo "Khởi động Supabase lỗi, thử lại lần $((n+1)) sau $((n*30)) giây…"
            supabase stop --no-backup || true
            sleep $((n*30))
          done
        env:
          SUPABASE_AUTH_GOOGLE_CLIENT_ID: ci
          SUPABASE_AUTH_GOOGLE_SECRET: ci
      - name: Chạy test RLS (pgTAP)
        run: supabase test db
        env:
          SUPABASE_AUTH_GOOGLE_CLIENT_ID: ci
          SUPABASE_AUTH_GOOGLE_SECRET: ci
