name: CI

# Chạy khi push lên mọi nhánh (repo hiện chỉ có nhánh phát triển), khi mở PR, hoặc bấm tay.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:scripts
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder
          VITE_GOOGLE_HD: example.com

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  functions:
    name: Edge Functions (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check */index.ts
        working-directory: supabase/functions
      - run: deno test _shared/
        working-directory: supabase/functions

  database:
    # Postgres 16 có sẵn trên runner + pgTAP (không tải image Docker: registry của Supabase
    # hay giới hạn lượt tải từ GitHub Actions). Cùng cách chạy với `npm run test:rls` ở máy.
    # Muốn chạy trên Supabase đầy đủ: `npx supabase start && npx supabase test db` (cần Docker).
    name: Migrations + RLS tests (Postgres 16 + pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cài pgTAP + pg_prove
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-16-pgtap libtap-parser-sourcehandler-pgtap-perl
      - name: Khởi động Postgres
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -q -c "alter user postgres password 'postgres'"
      - name: Chạy migration + test RLS (pgTAP)
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
        run: bash supabase/tests/run-local.sh
